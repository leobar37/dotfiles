    local: true
    hostname: leobar37-ms-7d46
    tailscale_ip: 100.83.90.33
    tailscale_name: leobar37-ms-7d46
    user: leobar37
    os: Ubuntu (linux x64, i5-12400F)
    role: canonical
    status: ok
  - name: gcp-avileo-prod
    hostname: avileo-prod-01
    ssh_alias: gcp-avileo-prod
    transport: iap-tunnel
    project: elena-tech-prod
    zone: southamerica-east1-a
    user: leobar37
    os: Ubuntu 24.04 LTS (x86_64, e2-custom-4-24576)
    role: produccion
    status: ok
  - name: gdev
