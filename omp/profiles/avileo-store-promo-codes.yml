# Overlay de roles para ejecutar el plan avileo-store-promo-codes (worktree theelena/develop).
# Uso:
#   .plans/avileo-store-promo-codes/orchestration/omp-session.sh
#   (o directo: omp --config ~/code/dotfiles/omp/profiles/avileo-store-promo-codes.yml "...")
# Repetible: --config puede pasarse varias veces, gana el último.
# Nota: --config aplica solo al run (no sale en `config list`).
# Nota 2: para workers OMP delegados, el modelo se fija por sesión con set_model,
#   que pisa a este overlay.
setupVersion: 2
modelRoles:
  # --- tareas fáciles / mecánicas: flash (barato y rápido) ---
  commit: zai/glm-5.3-flash:high   # commits, chores, syncs
  smol: zai/glm-5.3-flash:high     # tareas fáciles: scaffolds, specs, greps, docs
  tiny: zai/glm-5.3-flash:high
  # --- trabajo pesado del plan: pro (fases T-001..T-006, debugging, contratos) ---
  default: zai/glm-5.3             # modelo por defecto de la sesión
  slow: zai/glm-5.3                # implementación de fases, gates difíciles
  plan: zai/glm-5.3                # planificación/revisión de contratos
  advisor: zai/glm-5.3             # decisiones de arquitectura
